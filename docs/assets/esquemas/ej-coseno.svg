<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 644 370" role="img">
  <title>Ejercicio 2: tres vectores sin normalizar</title>
  <desc>a = (2, 0) apunta a matrícula, b = (1, 1) está a medio camino y c = (0, 3) apunta a cafetería. Hay que calcular normas, cosenos, producto escalar y distancia.</desc>
