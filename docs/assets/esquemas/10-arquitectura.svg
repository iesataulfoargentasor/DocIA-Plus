<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754 336" role="img">
  <title>La web no consulta ChromaDB directamente</title>
  <desc>Quien busca en la colección es la API. Los documentos originales y las copias viven aparte.</desc>
  <rect width="754" height="336" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <text x="24" y="22" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="18" font-weight="650">ChromaDB no se abre a internet</text>
<rect x="24" y="64" width="210" height="78" rx="14" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="129.0" y="98" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Comunidad educativa</text>
<text x="129.0" y="120" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">pregunta en la web</text>
<rect x="280" y="64" width="180" height="78" rx="14" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="370.0" y="98" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">API</text>
<text x="370.0" y="120" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">solo ella consulta</text>
<rect x="510" y="28" width="220" height="78" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
<text x="620.0" y="62" text-anchor="middle" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">ChromaDB</text>
<text x="620.0" y="84" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">colección privada</text>
<rect x="510" y="140" width="220" height="78" rx="14" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="620.0" y="174" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Titan v2</text>
<text x="620.0" y="196" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">vector de la pregunta</text>
<rect x="280" y="200" width="180" height="78" rx="14" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="370.0" y="234" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">S3</text>
<text x="370.0" y="256" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">originales y copias</text>
<line x1="234" y1="103" x2="276" y2="103" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="460" y1="86" x2="506" y2="67" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="460" y1="120" x2="506" y2="160" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<text x="24" y="308" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">La web habla con la API. La API habla con la base.</text>
</svg>
