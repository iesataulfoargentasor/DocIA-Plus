<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 228" role="img">
  <title>No se puede consultar en 256 una colección indexada en 1024</title>
  <desc>Los dos vectores tienen que salir del mismo modelo, con la misma dimensión y la misma normalización.</desc>
  <rect width="748" height="228" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <rect x="24" y="24" width="340" height="180" rx="16" fill="#e8f5e9" stroke="#b7dfb9" stroke-width="1.5"/>
<text x="194" y="58" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Válido</text>
<rect x="48" y="80" width="120" height="64" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
<text x="108" y="108" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">1024</text>
<text x="108" y="130" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">indexado</text>
<text x="194" y="118" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700">=</text>
<rect x="220" y="80" width="120" height="64" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
<text x="280" y="108" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">1024</text>
<text x="280" y="130" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">consulta</text>
<text x="194" y="176" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="14" font-weight="500">misma dimensión y norma</text>
<rect x="384" y="24" width="340" height="180" rx="16" fill="#fdecea" stroke="#f5c6c2" stroke-width="1.5"/>
<text x="554" y="58" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">No válido</text>
<rect x="408" y="80" width="120" height="64" rx="12" fill="#ffffff" stroke="#b71c1c" stroke-width="2"/>
<text x="468" y="108" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">1024</text>
<text x="468" y="130" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">indexado</text>
<text x="554" y="118" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700">≠</text>
<rect x="580" y="80" width="120" height="64" rx="12" fill="#ffffff" stroke="#b71c1c" stroke-width="2"/>
<text x="640" y="108" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">256</text>
<text x="640" y="130" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">consulta</text>
<text x="554" y="176" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="14" font-weight="500">hay que reindexar todo</text>
</svg>
