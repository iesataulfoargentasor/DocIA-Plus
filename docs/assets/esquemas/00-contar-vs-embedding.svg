<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img">
  <title>Contar palabras frente a un embedding</title>
  <desc>Contando palabras, la pregunta y el documento no comparten ninguna y su coseno es 0. Con un embedding, los dos vectores apuntan casi al mismo sitio y su coseno es 0,997.</desc>
  <rect width="760" height="400" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <text x="24" y="34" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="18" font-weight="650">Dos formas de convertir un texto en vector</text>
<rect x="16" y="52" width="364" height="300" rx="14" fill="#fdecea" stroke="#f5c6c2" stroke-width="1.5"/>
<text x="32" y="78" text-anchor="start" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">1975 · contar palabras</text>
<text x="216" y="104" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">P</text>
<text x="296" y="104" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">F</text>
<rect x="32" y="116" width="332" height="24" rx="6" fill="#ffffff" stroke="#d5daf0" stroke-width="1"/>
<text x="44" y="133" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">cómo</text>
<text x="216" y="133" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">1</text>
<text x="296" y="133" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">0</text>
<rect x="32" y="144" width="332" height="24" rx="6" fill="#ffffff" stroke="#d5daf0" stroke-width="1"/>
<text x="44" y="161" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">me</text>
<text x="216" y="161" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">1</text>
<text x="296" y="161" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">0</text>
<rect x="32" y="172" width="332" height="24" rx="6" fill="#ffffff" stroke="#d5daf0" stroke-width="1"/>
<text x="44" y="189" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">matriculo</text>
<text x="216" y="189" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">1</text>
<text x="296" y="189" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">0</text>
<rect x="32" y="200" width="332" height="24" rx="6" fill="#ffffff" stroke="#d5daf0" stroke-width="1"/>
