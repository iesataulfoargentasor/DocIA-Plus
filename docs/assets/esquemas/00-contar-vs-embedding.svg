<text x="216" y="217" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">0</text>
<text x="296" y="217" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">1</text>
<rect x="32" y="228" width="332" height="24" rx="6" fill="#ffffff" stroke="#d5daf0" stroke-width="1"/>
<text x="44" y="245" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">formalización</text>
<text x="216" y="245" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">0</text>
<text x="296" y="245" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">1</text>
<rect x="32" y="256" width="332" height="24" rx="6" fill="#ffffff" stroke="#d5daf0" stroke-width="1"/>
<text x="44" y="273" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">matrícula</text>
<text x="216" y="273" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">0</text>
<text x="296" y="273" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">1</text>
<text x="32" y="308" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Ninguna palabra en común:</text>
<text x="32" y="330" text-anchor="start" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">coseno 0, «no se parecen nada»</text>
<rect x="396" y="52" width="348" height="300" rx="14" fill="#e8f5e9" stroke="#b7dfb9" stroke-width="1.5"/>
<text x="412" y="78" text-anchor="start" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">2013 en adelante · embedding</text>
<line x1="440" y1="280" x2="640" y2="280" stroke="#5c657a" stroke-width="1.2"/>
<line x1="440" y1="280" x2="440" y2="110" stroke="#5c657a" stroke-width="1.2"/>
<text x="640" y="298" text-anchor="end" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">matrícula</text>
<text x="446" y="122" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">cafetería</text>
<line x1="440" y1="280" x2="576" y2="246" stroke="#3949ab" stroke-width="3" marker-end="url(#flecha)"/>
<text x="584" y="250" text-anchor="start" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">P (4, 1)</text>
<line x1="440" y1="280" x2="542" y2="246" stroke="#2e7d32" stroke-width="3" marker-end="url(#flecha)"/>
<text x="524" y="234" text-anchor="start" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">F (3, 1)</text>
<text x="412" y="308" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Apuntan casi al mismo sitio:</text>
<text x="412" y="330" text-anchor="start" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">coseno 0,997, «se parecen mucho»</text>
<text x="24" y="380" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">P = «¿Cómo me matriculo?»   F = «Procedimiento de formalización de matrícula»</text>
</svg>
