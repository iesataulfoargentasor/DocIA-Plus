<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 270" role="img">
  <title>El fragmento y la pregunta pasan por el mismo modelo</title>
  <desc>Indexar y consultar usan Titan Embeddings v2 con 1024 dimensiones y normalización. El vector de la pregunta no se almacena.</desc>
  <rect width="772" height="270" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <rect x="24" y="36" width="200" height="70" rx="14" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="124" y="66" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="16" font-weight="650">Fragmento</text>
<text x="124" y="88" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">texto del documento</text>
<rect x="24" y="150" width="200" height="70" rx="14" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="124" y="180" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="16" font-weight="650">Pregunta</text>
<text x="124" y="202" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">texto del usuario</text>
<line x1="224" y1="71" x2="286" y2="128" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="224" y1="185" x2="286" y2="148" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="286" y="78" width="210" height="120" rx="16" fill="#3949ab" stroke="#3949ab" stroke-width="0"/>
<text x="391" y="118" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Un solo modelo</text>
<text x="391" y="144" text-anchor="middle" fill="#e8eaf6" font-family="Segoe UI, sans-serif" font-size="14" font-weight="500">Titan Embeddings v2</text>
<text x="391" y="168" text-anchor="middle" fill="#e8eaf6" font-family="Segoe UI, sans-serif" font-size="14" font-weight="500">1024 · normalizado</text>
<line x1="496" y1="120" x2="548" y2="78" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="496" y1="156" x2="548" y2="198" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="548" y="36" width="200" height="78" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="648" y="66" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Vector del fragmento</text>
<text x="648" y="90" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">se guarda</text>
<rect x="548" y="156" width="200" height="78" rx="14" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="648" y="186" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Vector de la pregunta</text>
<text x="648" y="210" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">no se guarda</text>
</svg>
