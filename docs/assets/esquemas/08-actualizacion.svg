  </defs>
  <text x="24" y="34" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="18" font-weight="650">Actualizar calendario-2026 sin dejar huérfanos</text>
<text x="24" y="58" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">Antes: cuatro fragmentos</text>
