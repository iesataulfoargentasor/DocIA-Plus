<text x="96" y="104" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">_000</text>
<text x="96" y="124" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">igual</text>
<rect x="180" y="76" width="144" height="64" rx="12" fill="#fff8e1" stroke="#ef6c00" stroke-width="2"/>
<text x="252" y="104" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">_001</text>
<text x="252" y="124" text-anchor="middle" fill="#ef6c00" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">ha cambiado</text>
<rect x="336" y="76" width="144" height="64" rx="12" fill="#fdecea" stroke="#b71c1c" stroke-width="2"/>
<text x="408" y="104" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">_002</text>
<text x="408" y="124" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">ya no está</text>
<rect x="492" y="76" width="144" height="64" rx="12" fill="#fdecea" stroke="#b71c1c" stroke-width="2"/>
<text x="564" y="104" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">_003</text>
<text x="564" y="124" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">ya no está</text>
<text x="24" y="176" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">Después</text>
<rect x="24" y="192" width="200" height="78" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="124" y="222" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">_000 se queda</text>
<text x="124" y="244" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400">el hash coincide: no hay llamada</text>
<rect x="244" y="192" width="200" height="78" rx="12" fill="#fff8e1" stroke="#ef6c00" stroke-width="2"/>
<text x="344" y="222" text-anchor="middle" fill="#ef6c00" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">_001 upsert</text>
<text x="344" y="244" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400">mismo id, vector nuevo</text>
<rect x="464" y="192" width="200" height="78" rx="12" fill="#fdecea" stroke="#b71c1c" stroke-width="2"/>
<text x="564" y="222" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">_002 y _003</text>
<text x="564" y="244" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">delete</text>
