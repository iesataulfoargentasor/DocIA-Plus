<text x="40" y="172" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Pregunta 3</text>
<text x="160" y="172" text-anchor="start" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">sí</text>
<text x="210" y="172" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">dentro del top 5</text>
<rect x="24" y="188" width="420" height="32" rx="8" fill="#fdecea" stroke="#fdecea" stroke-width="0"/>
