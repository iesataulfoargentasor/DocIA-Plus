<text x="210" y="96" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">dentro del top 5</text>
<rect x="24" y="112" width="420" height="32" rx="8" fill="#e8f5e9" stroke="#e8f5e9" stroke-width="0"/>
