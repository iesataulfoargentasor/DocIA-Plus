<text x="210" y="324" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">dentro del top 5</text>
<rect x="24" y="340" width="420" height="32" rx="8" fill="#fdecea" stroke="#fdecea" stroke-width="0"/>
<text x="40" y="362" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Pregunta 8</text>
<text x="160" y="362" text-anchor="start" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">no</text>
<text x="210" y="362" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">no aparece</text>
<rect x="460" y="74" width="200" height="120" rx="16" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="560" y="112" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700">62,5 %</text>
<text x="560" y="140" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">objetivo: más del 80 %</text>
<text x="560" y="164" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">con k entre 3 y 5</text>
