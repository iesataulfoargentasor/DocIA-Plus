<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 352" role="img">
  <title>El modelo importa</title>
  <desc>Con un modelo entrenado en inglés, las frases de matrícula quedan en los puestos 3 y 5. Con el modelo multilingüe del cuaderno quedan en los puestos 1 y 2.</desc>
