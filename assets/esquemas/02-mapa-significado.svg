<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 536" role="img">
  <title>Un mapa de significado con dos ejes</title>
  <desc>Cinco textos colocados según cuánto hablan de matrícula y de cafetería. Los textos de matrícula quedan juntos, incluida la pregunta, y los de cafetería en otra zona.</desc>
  <rect width="712" height="536" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <text x="24" y="34" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="18" font-weight="650">Un mapa de significado con dos ejes inventados</text>
<ellipse cx="278" cy="298.8" rx="91.0" ry="52.0" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5" stroke-dasharray="6 5"/>
<ellipse cx="101.2" cy="148.0" rx="62.4" ry="67.60000000000001" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="70" y1="330" x2="392.40000000000003" y2="330" stroke="#1c2340" stroke-width="1.5"/>
<line x1="70" y1="330" x2="70" y2="85.6" stroke="#1c2340" stroke-width="1.5"/>
<line x1="122" y1="330" x2="122" y2="335" stroke="#5c657a" stroke-width="1"/>
<text x="122" y="350" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">1</text>
<line x1="174" y1="330" x2="174" y2="335" stroke="#5c657a" stroke-width="1"/>
<text x="174" y="350" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">2</text>
<line x1="226" y1="330" x2="226" y2="335" stroke="#5c657a" stroke-width="1"/>
<text x="226" y="350" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">3</text>
<line x1="278" y1="330" x2="278" y2="335" stroke="#5c657a" stroke-width="1"/>
<text x="278" y="350" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">4</text>
<line x1="330" y1="330" x2="330" y2="335" stroke="#5c657a" stroke-width="1"/>
<text x="330" y="350" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">5</text>
<line x1="65" y1="278" x2="70" y2="278" stroke="#5c657a" stroke-width="1"/>
<text x="58" y="282" text-anchor="end" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">1</text>
<line x1="65" y1="226" x2="70" y2="226" stroke="#5c657a" stroke-width="1"/>
<text x="58" y="230" text-anchor="end" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">2</text>
<line x1="65" y1="174" x2="70" y2="174" stroke="#5c657a" stroke-width="1"/>
<text x="58" y="178" text-anchor="end" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">3</text>
<line x1="65" y1="122" x2="70" y2="122" stroke="#5c657a" stroke-width="1"/>
<text x="58" y="126" text-anchor="end" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">4</text>
<text x="231.20000000000002" y="374" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">eje 1: cuánto habla de matrícula  →</text>
<text x="24" y="205.2" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500" transform="rotate(-90 24 205.2)">eje 2: cuánto habla de cafetería  →</text>
<circle cx="278" cy="278" r="8" fill="#3949ab"/>
<text x="278" y="264" text-anchor="middle" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800">P</text>
<circle cx="226" cy="278" r="8" fill="#00796b"/>
<text x="226" y="264" text-anchor="middle" fill="#00796b" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800">F</text>
<circle cx="330" cy="330" r="8" fill="#2e7d32"/>
<text x="330" y="316" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800">I</text>
<circle cx="122" cy="122" r="8" fill="#ef6c00"/>
<text x="122" y="108" text-anchor="middle" fill="#ef6c00" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800">C</text>
<circle cx="70" cy="174" r="8" fill="#b71c1c"/>
<text x="70" y="160" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800">B</text>
<text x="278" y="233.8" text-anchor="middle" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">textos de matrícula</text>
<text x="103.80000000000001" y="223.4" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">textos de cafetería</text>
<rect x="452" y="70" width="236" height="214" rx="14" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="468" y="98" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Cada texto es un punto.</text>
<text x="468" y="118" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">Los que hablan de lo mismo</text>
<text x="468" y="138" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">quedan juntos.</text>
<text x="468" y="178" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">La pregunta P cae en el grupo</text>
<text x="468" y="198" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">de matrícula, aunque no repita</text>
<text x="468" y="218" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">las palabras de F ni de I.</text>
<text x="468" y="258" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Buscar es mirar qué hay cerca.</text>
<rect x="24" y="400" width="664" height="116" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="40" y="426" text-anchor="start" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">P  Pregunta: ¿cómo me matriculo?  (4, 1)</text>
<text x="40" y="446" text-anchor="start" fill="#00796b" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">F  Procedimiento de formalización de matrícula  (3, 1)</text>
<text x="40" y="466" text-anchor="start" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">I  Plazo de inscripción en el ciclo  (5, 0)</text>
<text x="40" y="486" text-anchor="start" fill="#ef6c00" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">C  Menú diario de la cafetería  (1, 4)</text>
<text x="40" y="506" text-anchor="start" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">B  Precio del bocadillo  (0, 3)</text>
</svg>
