<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 340" role="img">
  <title>El documento se parte en fragmentos que se solapan</title>
  <desc>Cada fragmento tiene su propio vector. El solape repite un trozo para no partir la frase que responde a la pregunta.</desc>
  <rect width="748" height="340" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <text x="24" y="36" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="18" font-weight="650">Un documento, varios fragmentos con solape</text>
<rect x="24" y="52" width="700" height="36" rx="8" fill="#eef0f6" stroke="#d5daf0" stroke-width="1.5"/>
<text x="36" y="75" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">PDF entero: acceso + contenidos + evaluación + bibliografía</text>
<rect x="24" y="128" width="190" height="72" rx="12" fill="#ffffff" stroke="#3949ab" stroke-width="2"/>
<text x="119" y="158" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">Fragmento 0</text>
<text x="119" y="180" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">Acceso</text>
<line x1="119" y1="200" x2="119" y2="236" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<circle cx="119" cy="254" r="10" fill="#3949ab"/>
<rect x="268" y="128" width="190" height="72" rx="12" fill="#ffffff" stroke="#00796b" stroke-width="2"/>
<text x="363" y="158" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">Fragmento 1</text>
<text x="363" y="180" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">Contenidos</text>
<line x1="363" y1="200" x2="363" y2="236" stroke="#00796b" stroke-width="2" marker-end="url(#flecha)"/>
<circle cx="363" cy="254" r="10" fill="#00796b"/>
<rect x="512" y="128" width="190" height="72" rx="12" fill="#ffffff" stroke="#ef6c00" stroke-width="2"/>
<text x="607" y="158" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">Fragmento 2</text>
<text x="607" y="180" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">Evaluación</text>
<line x1="607" y1="200" x2="607" y2="236" stroke="#ef6c00" stroke-width="2" marker-end="url(#flecha)"/>
<circle cx="607" cy="254" r="10" fill="#ef6c00"/>
<rect x="214" y="146" width="54" height="36" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
<text x="241" y="169" text-anchor="middle" fill="#ef6c00" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">solape</text>
<rect x="458" y="146" width="54" height="36" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
<text x="485" y="169" text-anchor="middle" fill="#ef6c00" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">solape</text>
<text x="24" y="292" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">Cada círculo es un vector. El solape repite un trozo</text>
<text x="24" y="314" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">para no cortar la frase que responde a la pregunta.</text>
</svg>
