<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 366" role="img">
  <title>Las dos fases de la búsqueda semántica</title>
  <desc>Primero se indexan los documentos: se trocean, se convierten en vectores y se guardan. Después, cada pregunta se convierte en vector con el mismo modelo y se buscan los fragmentos más cercanos.</desc>
  <rect width="784" height="366" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <rect x="16" y="20" width="752" height="128" rx="16" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="32" y="48" text-anchor="start" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Fase 1 · Indexar. Se hace una vez, antes de que nadie pregunte</text>
<rect x="32" y="66" width="152" height="62" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="108" y="94" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Documento</text>
<text x="108" y="114" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">PDF, web, guía</text>
<line x1="186" y1="97" x2="212" y2="97" stroke="#3949ab" stroke-width="2.5" marker-end="url(#flecha)"/>
<rect x="216" y="66" width="152" height="62" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="292" y="94" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Fragmentos</text>
<text x="292" y="114" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">trozos de texto</text>
<line x1="370" y1="97" x2="396" y2="97" stroke="#3949ab" stroke-width="2.5" marker-end="url(#flecha)"/>
<rect x="400" y="66" width="152" height="62" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="476" y="94" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Modelo</text>
<text x="476" y="114" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">de embeddings</text>
<line x1="554" y1="97" x2="580" y2="97" stroke="#3949ab" stroke-width="2.5" marker-end="url(#flecha)"/>
<rect x="584" y="66" width="152" height="62" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="660" y="94" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Base vectorial</text>
<text x="660" y="114" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">guarda texto y vector</text>
<rect x="16" y="162" width="752" height="128" rx="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="32" y="190" text-anchor="start" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Fase 2 · Consultar. Se hace con cada pregunta</text>
<rect x="32" y="208" width="152" height="62" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="108" y="236" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Pregunta</text>
<text x="108" y="256" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">de una persona</text>
<line x1="186" y1="239" x2="212" y2="239" stroke="#3949ab" stroke-width="2.5" marker-end="url(#flecha)"/>
<rect x="216" y="208" width="152" height="62" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="292" y="236" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Modelo</text>
<text x="292" y="256" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">el mismo que en la fase 1</text>
<line x1="370" y1="239" x2="396" y2="239" stroke="#3949ab" stroke-width="2.5" marker-end="url(#flecha)"/>
<rect x="400" y="208" width="152" height="62" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="476" y="236" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Base vectorial</text>
<text x="476" y="256" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">busca los más cercanos</text>
<line x1="554" y1="239" x2="580" y2="239" stroke="#3949ab" stroke-width="2.5" marker-end="url(#flecha)"/>
<rect x="584" y="208" width="152" height="62" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="660" y="236" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Fragmentos</text>
<text x="660" y="256" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">3 a 5, con su fuente</text>
<text x="24" y="322" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">El paso caro (leer, trocear, calcular vectores) se hace una sola vez.</text>
<text x="24" y="344" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">Cada pregunta solo hace una llamada al modelo y una búsqueda.</text>
</svg>
