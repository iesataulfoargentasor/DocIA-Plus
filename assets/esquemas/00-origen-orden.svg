<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
  <title>La base vectorial no se inventó para el chatbot</title>
  <desc>El orden real es búsqueda de parecidos, índice, base de datos en 2019 y RAG en 2020.</desc>
  <rect width="720" height="320" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="330" height="280" rx="16" fill="#fdecea" stroke="#f5c6c2" stroke-width="1.5"/>
<text x="185" y="52" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Lo que parece</text>
<rect x="48" y="76" width="274" height="52" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="185" y="108" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">Primero el chatbot RAG</text>
<line x1="185" y1="128" x2="185" y2="158" stroke="#b71c1c" stroke-width="2" marker-end="url(#flecha-roja)"/>
<rect x="48" y="162" width="274" height="52" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="185" y="194" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">Luego se inventa la base</text>
<text x="185" y="268" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Ese orden es al revés</text>
<rect x="370" y="20" width="330" height="280" rx="16" fill="#e8f5e9" stroke="#b7dfb9" stroke-width="1.5"/>
<text x="535" y="52" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Lo que ocurrió</text>
<rect x="394" y="72" width="282" height="36" rx="10" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="535" y="96" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Fotos y música parecidas</text>
<rect x="394" y="114" width="282" height="36" rx="10" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="535" y="138" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Un índice para millones</text>
<rect x="394" y="156" width="282" height="36" rx="10" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="535" y="180" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">La base de datos, 2019</text>
<rect x="394" y="198" width="282" height="36" rx="10" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="535" y="222" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">El RAG la usa, 2020</text>
<text x="535" y="268" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">La base ya existía</text>
</svg>
