<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 262" role="img">
  <title>El coseno mide el ángulo, no la longitud</title>
  <desc>Si los vectores están normalizados, mirar al mismo sitio da coseno 1. Un ángulo recto da coseno 0.</desc>
  <rect width="744" height="262" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <rect x="24" y="16" width="220" height="230" rx="16" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="134" y="46" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">Misma dirección</text>
<line x1="54" y1="150" x2="174" y2="90" stroke="#2e7d32" stroke-width="3" marker-end="url(#flecha)"/>
<text x="134" y="214" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">coseno = 1</text>
<rect x="262" y="16" width="220" height="230" rx="16" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="372" y="46" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">Ángulo pequeño</text>
<line x1="292" y1="160" x2="422" y2="150" stroke="#3949ab" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="292" y1="160" x2="382" y2="70" stroke="#3949ab" stroke-width="3" marker-end="url(#flecha)"/>
<text x="372" y="214" text-anchor="middle" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">coseno alto</text>
<rect x="500" y="16" width="220" height="230" rx="16" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="610" y="46" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">Perpendiculares</text>
<line x1="530" y1="160" x2="660" y2="160" stroke="#ef6c00" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="530" y1="160" x2="530" y2="70" stroke="#ef6c00" stroke-width="3" marker-end="url(#flecha)"/>
<text x="610" y="214" text-anchor="middle" fill="#ef6c00" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">coseno = 0</text>
</svg>
