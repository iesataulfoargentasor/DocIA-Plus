<line x1="246" y1="330" x2="246" y2="335" stroke="#5c657a" stroke-width="1"/>
<text x="246" y="350" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">4</text>
<line x1="290" y1="330" x2="290" y2="335" stroke="#5c657a" stroke-width="1"/>
