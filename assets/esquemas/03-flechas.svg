<circle cx="114" cy="110" r="6" fill="#ef6c00"/>
<line x1="70" y1="330" x2="202" y2="275" stroke="#00796b" stroke-width="3"/>
<circle cx="202" cy="275" r="6" fill="#00796b"/>
<line x1="246" y1="275" x2="114" y2="110" stroke="#b71c1c" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="194.0" y="192.5" text-anchor="start" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">P a C: 4,24</text>
<line x1="251" y1="290" x2="603" y2="180" stroke="#b71c1c" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="442.0" y="256.0" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">P a G: 8,25</text>
<text x="244" y="299" text-anchor="middle" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800">P</text>
<text x="198" y="263" text-anchor="middle" fill="#00796b" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800">F</text>
<text x="126" y="104" text-anchor="start" fill="#ef6c00" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800">C</text>
<text x="598" y="151" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800">G</text>
<rect x="24" y="388" width="632" height="64" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="40" y="414" text-anchor="start" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">P  Pregunta: ¿cómo me matriculo?  (4, 1)</text>
<text x="356" y="414" text-anchor="start" fill="#00796b" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">F  Formalización de matrícula  (3, 1)</text>
<text x="40" y="438" text-anchor="start" fill="#ef6c00" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">C  Menú de la cafetería  (1, 4)</text>
<text x="356" y="438" text-anchor="start" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">G  Guía larga de matrícula  (12, 3)</text>
<text x="24" y="480" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">La guía G apunta al mismo sitio que la pregunta P, pero es tres veces más larga.</text>
<text x="24" y="502" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">En línea recta queda más lejos que la cafetería. La distancia euclídea se equivoca.</text>
</svg>
