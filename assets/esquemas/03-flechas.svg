<line x1="510" y1="330" x2="510" y2="335" stroke="#5c657a" stroke-width="1"/>
<line x1="554" y1="330" x2="554" y2="335" stroke="#5c657a" stroke-width="1"/>
<line x1="598" y1="330" x2="598" y2="335" stroke="#5c657a" stroke-width="1"/>
<text x="598" y="350" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">12</text>
<line x1="65" y1="275" x2="70" y2="275" stroke="#5c657a" stroke-width="1"/>
<text x="58" y="279" text-anchor="end" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">1</text>
<line x1="65" y1="220" x2="70" y2="220" stroke="#5c657a" stroke-width="1"/>
<text x="58" y="224" text-anchor="end" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">2</text>
<line x1="65" y1="165" x2="70" y2="165" stroke="#5c657a" stroke-width="1"/>
<text x="58" y="169" text-anchor="end" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">3</text>
<line x1="65" y1="110" x2="70" y2="110" stroke="#5c657a" stroke-width="1"/>
<text x="58" y="114" text-anchor="end" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">4</text>
<text x="356.0" y="372" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">eje 1: habla de matrícula  →</text>
<text x="26" y="198.0" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500" transform="rotate(-90 26 198.0)">eje 2: habla de cafetería  →</text>
