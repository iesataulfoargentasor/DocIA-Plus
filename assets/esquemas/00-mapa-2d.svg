<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" role="img">
  <title>Mapa de dos ejes con tres frases del centro</title>
  <desc>Matrícula e inscripción quedan juntas. El horario de cafetería queda lejos. Los ejes son didácticos.</desc>
  <rect width="760" height="496" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <text x="24" y="32" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="18" font-weight="650">Un mapa de dos ejes, solo para verlo</text>
<line x1="70" y1="390" x2="560" y2="390" stroke="#1c2340" stroke-width="1.5"/>
<line x1="70" y1="390" x2="70" y2="70" stroke="#1c2340" stroke-width="1.5"/>
<text x="300" y="418" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">más formal  →</text>
<text x="22" y="230" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500" transform="rotate(-90 22 230)">más trámite de estudios  →</text>
<circle cx="456.4" cy="123.0" r="46" fill="#e8eaf6" stroke="#3949ab" stroke-dasharray="4 4"/>
<circle cx="461.0" cy="120.0" r="8" fill="#3949ab"/>
<circle cx="451.79999999999995" cy="126.0" r="8" fill="#00796b"/>
<circle cx="116.0" cy="330.0" r="8" fill="#ef6c00"/>
<text x="477.0" y="112.0" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Matrícula en el ciclo</text>
<text x="467.79999999999995" y="144.0" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Inscripción en el curso</text>
<text x="130.0" y="334.0" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Horario de cafetería</text>
<text x="24" y="448" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">Las dos de matrícula quedan juntas. La cafetería, no.</text>
<text x="24" y="470" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">Un embedding real usa 384 o 1024 ejes. Este dibujo solo tiene 2.</text>
</svg>
