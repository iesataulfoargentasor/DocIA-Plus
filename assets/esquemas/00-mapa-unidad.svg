<text x="110" y="155" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Sesión 1</text>
<rect x="36" y="172" width="148" height="28" rx="8" fill="#e8eaf6" stroke="#e8eaf6" stroke-width="0"/>
<text x="110" y="191" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Por qué existen</text>
