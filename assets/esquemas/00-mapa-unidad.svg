<line x1="578" y1="186" x2="592" y2="186" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="594" y="52" width="172" height="268" rx="14" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<rect x="594" y="52" width="172" height="44" rx="14" fill="#3949ab" stroke="#3949ab" stroke-width="0"/>
<rect x="594" y="80" width="172" height="16" rx="0" fill="#3949ab" stroke="#3949ab" stroke-width="0"/>
<text x="680" y="80" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Medir y montar</text>
<text x="680" y="120" text-anchor="middle" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="13" font-weight="650">¿Funciona? ¿Encaja?</text>
<rect x="606" y="136" width="148" height="28" rx="8" fill="#e8eaf6" stroke="#e8eaf6" stroke-width="0"/>
<text x="680" y="155" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">9. Calidad</text>
<rect x="606" y="172" width="148" height="28" rx="8" fill="#e8eaf6" stroke="#e8eaf6" stroke-width="0"/>
<text x="680" y="191" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">10. ChromaDB en DocIA+</text>
<rect x="606" y="280" width="148" height="28" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="680" y="299" text-anchor="middle" fill="#2e7d32" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Ejercicios</text>
<text x="24" y="348" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">En verde, la práctica que cierra cada bloque. Unas siete sesiones en total.</text>
