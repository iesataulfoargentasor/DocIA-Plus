<text x="490" y="191" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">6. Metadatos</text>
<rect x="416" y="208" width="148" height="28" rx="8" fill="#e8eaf6" stroke="#e8eaf6" stroke-width="0"/>
