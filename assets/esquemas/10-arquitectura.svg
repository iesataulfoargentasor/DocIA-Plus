<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 424" role="img">
  <title>Quién habla con quién en DocIA+</title>
  <desc>La web solo habla con la API. En la instancia, la API lee de un servidor ChromaDB que escucha en localhost y el indexador escribe en él. Titan calcula los vectores y S3 guarda originales y copias.</desc>
  <rect width="784" height="424" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <text x="24" y="32" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="18" font-weight="650">Quién habla con quién en DocIA+</text>
<rect x="24" y="96" width="170" height="72" rx="14" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="109" y="126" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Web del IES</text>
<text x="109" y="148" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">widget, internet</text>
<rect x="236" y="52" width="340" height="300" rx="16" fill="#eef0f6" stroke="#d5daf0" stroke-width="1.5"/>
<text x="252" y="76" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Instancia EC2 · 2 vCPU · 4 GB</text>
<rect x="256" y="92" width="300" height="60" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="406" y="118" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">API (FastAPI)</text>
<text x="406" y="138" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">abierta a internet, solo lee</text>
<rect x="256" y="182" width="300" height="60" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
<text x="406" y="208" text-anchor="middle" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Servidor ChromaDB</text>
<text x="406" y="228" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">localhost:8000, cerrado</text>
<rect x="256" y="272" width="300" height="60" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="406" y="298" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Indexador</text>
<text x="406" y="318" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">script del pipeline, escribe</text>
<line x1="336" y1="153" x2="336" y2="178" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<text x="346" y="170" text-anchor="start" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="12" font-weight="650">query</text>
<line x1="476" y1="271" x2="476" y2="246" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<text x="486" y="264" text-anchor="start" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="12" font-weight="650">upsert, delete</text>
<rect x="612" y="92" width="150" height="60" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="687" y="118" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Titan v2</text>
<text x="687" y="138" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">texto → vector</text>
<rect x="612" y="272" width="150" height="60" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="687" y="298" text-anchor="middle" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">S3</text>
<text x="687" y="318" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">originales y copias</text>
<line x1="196" y1="124" x2="252" y2="120" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="557" y1="118" x2="608" y2="118" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="557" y1="286" x2="640" y2="156" stroke="#3949ab" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#flecha)"/>
<line x1="608" y1="306" x2="560" y2="306" stroke="#3949ab" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="150" y1="170" x2="252" y2="206" stroke="#b71c1c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#flecha-roja)"/>
<text x="118" y="214" text-anchor="middle" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">✕ sin acceso</text>
<text x="24" y="384" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">Desde internet solo se llega a la API. Nadie de fuera abre el puerto de ChromaDB,</text>
<text x="24" y="404" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">y las escrituras salen de la propia máquina, no de la web.</text>
</svg>
