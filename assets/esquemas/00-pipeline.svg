<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 512" role="img">
  <title>Recorrido de una pregunta en DocIA+</title>
  <desc>La pregunta se convierte en números, ChromaDB devuelve los fragmentos más cercanos, se comprueba si están lo bastante cerca y otro modelo redacta la respuesta citando la fuente.</desc>
  <rect width="600" height="512" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <text x="24" y="36" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="20" font-weight="650">Dónde está la base vectorial en DocIA+</text>
<rect x="24" y="56" width="552" height="60" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<rect x="40" y="68" width="36" height="36" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="0"/>
<text x="58" y="92" text-anchor="middle" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">1</text>
<text x="92" y="82" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">Alguien pregunta en la web</text>
<text x="92" y="102" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">«¿Cómo me matriculo?»</text>
<rect x="24" y="126" width="552" height="60" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<rect x="40" y="138" width="36" height="36" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="0"/>
<text x="58" y="162" text-anchor="middle" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">2</text>
<text x="92" y="152" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">La pregunta se convierte en números</text>
<text x="92" y="172" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">Titan v2 la traduce a 1024 números</text>
<rect x="24" y="196" width="552" height="60" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
<rect x="40" y="208" width="36" height="36" rx="10" fill="#3949ab" stroke="#3949ab" stroke-width="0"/>
<text x="58" y="232" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">3</text>
<text x="92" y="222" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">ChromaDB busca lo más parecido</text>
<text x="92" y="242" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">entre los fragmentos de los documentos</text>
<text x="560" y="232" text-anchor="end" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="13" font-weight="650">esta unidad</text>
<rect x="24" y="266" width="552" height="60" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
<rect x="40" y="278" width="36" height="36" rx="10" fill="#3949ab" stroke="#3949ab" stroke-width="0"/>
<text x="58" y="302" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">4</text>
<text x="92" y="292" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">Devuelve los 3 a 5 más cercanos</text>
<text x="92" y="312" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">«Formalización de matrícula», el primero</text>
<text x="560" y="302" text-anchor="end" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="13" font-weight="650">esta unidad</text>
<rect x="24" y="336" width="552" height="60" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<rect x="40" y="348" width="36" height="36" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="0"/>
<text x="58" y="372" text-anchor="middle" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">5</text>
<text x="92" y="362" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">¿Está lo bastante cerca?</text>
<text x="92" y="382" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">si no, DocIA+ dice que no lo sabe</text>
<rect x="24" y="406" width="552" height="60" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<rect x="40" y="418" width="36" height="36" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="0"/>
<text x="58" y="442" text-anchor="middle" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">6</text>
<text x="92" y="432" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">Un modelo redacta la respuesta</text>
<text x="92" y="452" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">con esos fragmentos, citando el documento</text>
<text x="24" y="492" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">La unidad también enseña a medir el paso 5 (tema 9). El paso 6 es de PIA.</text>
</svg>
