<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 408" role="img">
  <title>El umbral solo existe si hay un hueco</title>
  <desc>Con un fragmento de índice, la pregunta sin respuesta queda a 0,013, entre las que sí tienen respuesta. Tras limpiarlo, queda a 0,307, por encima de la peor con respuesta (0,220), y cabe un umbral.</desc>
  <rect width="620" height="408" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <text x="24" y="32" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="17" font-weight="650">Distancia del primer resultado: preguntas con respuesta y sin respuesta</text>
<circle cx="40" cy="52" r="7" fill="#2e7d32"/>
<text x="54" y="57" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">pregunta con respuesta en los documentos</text>
<circle cx="360" cy="52" r="7" fill="#b71c1c"/>
<text x="374" y="57" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">pregunta sin respuesta</text>
<rect x="16" y="80" width="588" height="128" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="32" y="104" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Con el fragmento «Índice» del PDF</text>
<line x1="60" y1="158" x2="570.0" y2="158" stroke="#1c2340" stroke-width="1.5"/>
<line x1="60" y1="158" x2="60" y2="164" stroke="#5c657a" stroke-width="1"/>
<text x="60" y="180" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">0,0</text>
<line x1="210.0" y1="158" x2="210.0" y2="164" stroke="#5c657a" stroke-width="1"/>
<text x="210.0" y="180" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">0,1</text>
<line x1="360.0" y1="158" x2="360.0" y2="164" stroke="#5c657a" stroke-width="1"/>
<text x="360.0" y="180" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">0,2</text>
<line x1="510.0" y1="158" x2="510.0" y2="164" stroke="#5c657a" stroke-width="1"/>
<text x="510.0" y="180" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">0,3</text>
<circle cx="63.0" cy="146" r="7" fill="#2e7d32"/>
<circle cx="63.0" cy="134" r="7" fill="#2e7d32"/>
<circle cx="63.0" cy="122" r="7" fill="#2e7d32"/>
<circle cx="286.5" cy="146" r="7" fill="#2e7d32"/>
<circle cx="79.5" cy="110" r="7" fill="#b71c1c"/>
<text x="570.0" y="130" text-anchor="end" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">se mezclan: no hay umbral posible</text>
<rect x="16" y="230" width="588" height="128" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="32" y="254" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Tras limpiar el índice</text>
<line x1="60" y1="308" x2="570.0" y2="308" stroke="#1c2340" stroke-width="1.5"/>
<line x1="60" y1="308" x2="60" y2="314" stroke="#5c657a" stroke-width="1"/>
<text x="60" y="330" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">0,0</text>
<line x1="210.0" y1="308" x2="210.0" y2="314" stroke="#5c657a" stroke-width="1"/>
<text x="210.0" y="330" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">0,1</text>
<line x1="360.0" y1="308" x2="360.0" y2="314" stroke="#5c657a" stroke-width="1"/>
<text x="360.0" y="330" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">0,2</text>
<line x1="510.0" y1="308" x2="510.0" y2="314" stroke="#5c657a" stroke-width="1"/>
<text x="510.0" y="330" text-anchor="middle" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="500">0,3</text>
<circle cx="63.0" cy="296" r="7" fill="#2e7d32"/>
<circle cx="63.0" cy="284" r="7" fill="#2e7d32"/>
<circle cx="63.0" cy="272" r="7" fill="#2e7d32"/>
<circle cx="390.0" cy="296" r="7" fill="#2e7d32"/>
<circle cx="520.5" cy="296" r="7" fill="#b71c1c"/>
<line x1="450.0" y1="264" x2="450.0" y2="312" stroke="#3949ab" stroke-width="2" stroke-dasharray="5 4"/>
<text x="458.0" y="278" text-anchor="start" fill="#3949ab" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">umbral posible</text>
<text x="24" y="390" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400">Distancia coseno: menor es más parecido. Vectores de juguete, en ChromaDB 1.1.0.</text>
</svg>
