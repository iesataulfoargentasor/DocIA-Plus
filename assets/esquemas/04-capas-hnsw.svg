<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 492" role="img">
  <title>Una búsqueda HNSW baja por capas</title>
  <desc>La búsqueda entra por la capa con pocos nodos, salta al nodo más cercano a la consulta, baja de capa y afina en la capa completa hasta que ningún vecino mejora.</desc>
  <rect width="720" height="492" rx="18" fill="#f4f6fb"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3949ab"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b71c1c"/>
    </marker>
  </defs>
  <text x="24" y="30" text-anchor="start" fill="#1c2340" font-family="Segoe UI, sans-serif" font-size="18" font-weight="650">Cómo baja una búsqueda por las capas de HNSW</text>
<rect x="16" y="48" width="688" height="104" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="28" y="68" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Capa 2 · pocos nodos, saltos largos</text>
<rect x="16" y="160" width="688" height="104" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="28" y="180" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Capa 1 · más nodos</text>
<rect x="16" y="272" width="688" height="104" rx="12" fill="#ffffff" stroke="#d5daf0" stroke-width="1.5"/>
<text x="28" y="292" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Capa 0 · todos los fragmentos</text>
<line x1="60" y1="108" x2="60" y2="220" stroke="#d5daf0" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="60" y1="220" x2="60" y2="332" stroke="#d5daf0" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="220" y1="220" x2="220" y2="332" stroke="#d5daf0" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="460" y1="108" x2="460" y2="220" stroke="#ef6c00" stroke-width="3" stroke-dasharray="5 4"/>
<line x1="460" y1="220" x2="460" y2="332" stroke="#ef6c00" stroke-width="3" stroke-dasharray="5 4"/>
<line x1="620" y1="220" x2="620" y2="332" stroke="#d5daf0" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="60" y1="108" x2="460" y2="108" stroke="#ef6c00" stroke-width="4"/>
<line x1="60" y1="220" x2="220" y2="220" stroke="#d5daf0" stroke-width="2"/>
<line x1="220" y1="220" x2="460" y2="220" stroke="#d5daf0" stroke-width="2"/>
<line x1="460" y1="220" x2="620" y2="220" stroke="#d5daf0" stroke-width="2"/>
<line x1="60" y1="332" x2="140" y2="332" stroke="#d5daf0" stroke-width="2"/>
<line x1="140" y1="332" x2="220" y2="332" stroke="#d5daf0" stroke-width="2"/>
<line x1="220" y1="332" x2="300" y2="332" stroke="#d5daf0" stroke-width="2"/>
<line x1="300" y1="332" x2="380" y2="332" stroke="#d5daf0" stroke-width="2"/>
<line x1="380" y1="332" x2="460" y2="332" stroke="#d5daf0" stroke-width="2"/>
<line x1="460" y1="332" x2="540" y2="332" stroke="#ef6c00" stroke-width="4"/>
<line x1="540" y1="332" x2="620" y2="332" stroke="#d5daf0" stroke-width="2"/>
<circle cx="60" cy="108" r="13" fill="#ef6c00"/>
<text x="60" y="113" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">A</text>
<circle cx="460" cy="108" r="13" fill="#ef6c00"/>
<text x="460" y="113" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">F</text>
<circle cx="60" cy="220" r="13" fill="#3949ab"/>
<text x="60" y="225" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">A</text>
<circle cx="220" cy="220" r="13" fill="#3949ab"/>
<text x="220" y="225" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">C</text>
<circle cx="460" cy="220" r="13" fill="#ef6c00"/>
<text x="460" y="225" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">F</text>
<circle cx="620" cy="220" r="13" fill="#3949ab"/>
<text x="620" y="225" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">H</text>
<circle cx="60" cy="332" r="13" fill="#3949ab"/>
<text x="60" y="337" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">A</text>
<circle cx="140" cy="332" r="13" fill="#3949ab"/>
<text x="140" y="337" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">B</text>
<circle cx="220" cy="332" r="13" fill="#3949ab"/>
<text x="220" y="337" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">C</text>
<circle cx="300" cy="332" r="13" fill="#3949ab"/>
<text x="300" y="337" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">D</text>
<circle cx="380" cy="332" r="13" fill="#3949ab"/>
<text x="380" y="337" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">E</text>
<circle cx="460" cy="332" r="13" fill="#ef6c00"/>
<text x="460" y="337" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">F</text>
<circle cx="540" cy="332" r="13" fill="#ef6c00"/>
<text x="540" y="337" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">G</text>
<circle cx="620" cy="332" r="13" fill="#3949ab"/>
<text x="620" y="337" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">H</text>
<circle cx="515" cy="366" r="8" fill="#b71c1c"/>
<text x="531" y="371" text-anchor="start" fill="#b71c1c" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">consulta</text>
<text x="24" y="426" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">1) Entra por la capa 2 en A y salta a F, que queda más cerca de la consulta.</text>
<text x="24" y="448" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">2) Baja a la capa 1 y a la capa 0 en F. Allí mira sus vecinos y pasa a G, aún más cerca.</text>
<text x="24" y="470" text-anchor="start" fill="#5c657a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400">3) Los vecinos de G no mejoran. Se para y devuelve G sin haber visitado todos.</text>
</svg>
